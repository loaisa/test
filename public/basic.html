<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Базовый тест API</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; line-height: 1.5; }
    button { padding: 10px; background: #4CAF50; color: white; border: none; cursor: pointer; }
    #result { margin-top: 20px; padding: 15px; border: 1px solid #ddd; background: #f9f9f9; }
  </style>
</head>
<body>
  <h1>Базовый тест API</h1>
  <p>Эта страница проверяет базовое соединение без React.</p>
  
  <button onclick="testApi()">Проверить API</button>
  <div id="result">Результат будет здесь...</div>
  
  <hr>
  <p>URL: <span id="url"></span></p>
  <p>Timestamp: <span id="time"></span></p>

  <script>
    // Установка базовой информации
    document.getElementById('url').textContent = window.location.href;
    document.getElementById('time').textContent = new Date().toLocaleString();
    
    // Функция проверки API
    function testApi() {
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = 'Подключение...';
      
      fetch('https://friendsposts.up.railway.app/')
        .then(response => response.json())
        .then(data => {
          resultDiv.innerHTML = '<p>✅ Успешно!</p><pre>' + JSON.stringify(data, null, 2) + '</pre>';
        })
        .catch(error => {
          resultDiv.innerHTML = '<p>❌ Ошибка:</p><pre>' + error.message + '</pre>';
        });
    }
  </script>
</body>
</html>
