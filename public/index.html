<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <title>Friends posts</title>
    <style>
      .test-content {
        display: none;
        text-align: center;
        margin-top: 50px;
        font-family: Arial, sans-serif;
      }
      body.no-react .test-content {
        display: block;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div class="test-content">
      <h1>Тестовая страница</h1>
      <p>Если вы видите это сообщение, значит базовый HTML загружается, но React не рендерится.</p>
      <p>Проверьте консоль браузера на наличие ошибок.</p>
    </div>
    <script>
      // Если React не отрендерился в течение 3 секунд, показываем тестовую страницу
      setTimeout(function() {
        if (!document.getElementById('root').children.length) {
          document.body.classList.add('no-react');
        }
      }, 3000);
    </script>
  </body>
</html>
